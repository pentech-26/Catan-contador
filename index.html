<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contador de Catan</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preload" as="image" href="splash.webp">
<meta name="theme-color" content="#9e0306">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catan">
<meta name="description" content="Contador de puntos de victoria para Catan y sus expansiones.">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--sky1:#9e0306;--sky2:#d2400f;--sky3:#f39a2a;--sky4:#f8d77c;--sky5:#f6e8c2;--card:#fff9ec;--ink:#3b1508;--mute:#7a5440;--line:#ecd3a0;--accent:#1f7fb8;--red:#a3120c;--red2:#e0601a;--gold:#f5c518;--gold2:#e39a0b;--btn:#fdeec4;--btnh:#fbe09a;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#5e0204;--sky2:#7a1a08;--sky3:#3d1408;--sky4:#24100a;--sky5:#1a0b07;--card:#2b140d;--ink:#fbefd9;--mute:#c9a98c;--line:#4c2617;--accent:#6cc1e8;--red:#8f0f0a;--red2:#c4501a;--gold:#f5c518;--gold2:#e39a0b;--btn:#3a1c11;--btnh:#4a2516;--on:#1a0a05;color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#5e0204;--sky2:#7a1a08;--sky3:#3d1408;--sky4:#24100a;--sky5:#1a0b07;--card:#2b140d;--ink:#fbefd9;--mute:#c9a98c;--line:#4c2617;--accent:#6cc1e8;--red:#8f0f0a;--red2:#c4501a;--gold:#f5c518;--gold2:#e39a0b;--btn:#3a1c11;--btnh:#4a2516;--on:#1a0a05;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 240px,var(--sky3) 520px,var(--sky4) 820px,var(--sky5) 1200px) var(--sky5);color:var(--ink);font:600 16px/1.35 "Nunito Sans",system-ui,sans-serif}
.hero{background:transparent}
.hero div{max-width:1100px;margin:0 auto;padding:22px 16px 6px;display:flex;justify-content:center;text-align:center}
h1{margin:0;font:900 clamp(30px,7vw,52px)/1.05 "Cinzel",Georgia,serif;letter-spacing:.02em;background:linear-gradient(180deg,#fff2a0 0%,var(--gold) 45%,var(--gold2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #4a1a02) drop-shadow(0 3px 6px rgba(0,0,0,.35))}
h1 small{display:flex;align-items:center;justify-content:center;gap:12px;font:800 13px/1.4 "Nunito Sans",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#fff6e0;-webkit-text-fill-color:#fff6e0;margin-top:8px}
h1 small::before,h1 small::after{content:"";width:40px;height:3px;border-radius:2px;background:#fff6e0}
main{max-width:1100px;margin:0 auto;padding:16px}
.bar,.cc,.p{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(110,25,0,.18)}
.bar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:end;justify-content:center;padding:14px}
.bar>label,.bar .dd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--mute);text-align:center}
.bar label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:8px}
.target{display:flex;align-items:center;gap:8px}
.target b{font:900 32px/1 "Cinzel",Georgia,serif;min-width:2ch;text-align:center;color:var(--red)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .target b{color:var(--gold)}}
:root[data-theme="dark"] .target b{color:var(--gold)}
.mods{width:100%;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
.mods summary{cursor:pointer;font:700 16px/1.3 "Cinzel",Georgia,serif;color:var(--red);padding:4px 0;list-style-position:inside}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .mods summary{color:var(--gold)}}
:root[data-theme="dark"] .mods summary{color:var(--gold)}
.mods summary .cnt{font:800 12px "Nunito Sans",sans-serif;color:var(--mute);margin-left:6px}
.mg{margin-top:10px}
.mg h3{margin:0 0 6px;font:800 12px/1.2 "Nunito Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mg div{display:flex;flex-wrap:wrap;gap:6px 16px}
.mg label{display:flex;flex-direction:row;align-items:center;color:var(--ink);gap:6px;font-size:14px}
.mg label em{font-style:normal;color:var(--mute);font-size:12px}
.mg[hidden],.mg label[hidden]{display:none}
.warn{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--btn);border-left:5px solid var(--gold2);font-size:13px;color:var(--ink)}
.warn:empty{display:none}
input[type=checkbox]{accent-color:var(--red);width:18px;height:18px}
button{font:inherit;font-weight:800;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px;transition:background .15s,transform .1s}
button:hover:not(:disabled){background:var(--btnh)}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sq{width:40px;padding:0;font-size:20px;border-radius:50%}
.dd{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--mute)}
#sc{display:flex;justify-content:space-between;gap:12px;min-width:240px;max-width:100%;font-size:16px;text-align:left;padding:8px 12px}
#scl{text-align:left;position:absolute;top:100%;left:0;z-index:20;margin-top:4px;width:max-content;min-width:100%;max-width:min(92vw,380px);max-height:60vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(60,20,0,.28)}
#scl[hidden]{display:none}
.gt{font:700 15px/1.2 "Cinzel",Georgia,serif;color:var(--red);padding:12px 12px 6px;border-top:1px solid var(--line);background:var(--btn)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .gt{color:var(--gold)}}
:root[data-theme="dark"] .gt{color:var(--gold)}
.gt:first-child{border-top:0}
.op{display:flex;width:100%;justify-content:space-between;gap:12px;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;font-weight:600;text-align:left;padding:8px 12px;min-height:38px}
.op span:last-child{color:var(--mute);font-size:14px}
.op:hover{background:var(--btnh)}
.op[aria-selected=true]{color:var(--accent);font-weight:800}
.banner{margin:14px 0 0;padding:12px 16px;border-radius:14px;background:linear-gradient(180deg,#ffe470,var(--gold2));color:#3b1508;border:2px solid #b5700a;font:900 20px/1.25 "Cinzel",Georgia,serif;box-shadow:0 4px 14px rgba(200,120,0,.3)}
.grid{display:block;max-width:640px;margin:12px auto 0}
.stick{position:sticky;top:0;z-index:15;max-width:640px;margin:14px auto 0;padding-top:env(safe-area-inset-top,0px);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:0 0 14px 14px}
.scen{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 14px 10px;border-radius:16px;background:linear-gradient(180deg,var(--red) 0%,#c4280f 100%);color:#fff6e0;border:2px solid var(--gold2);box-shadow:0 6px 18px rgba(110,25,0,.25)}
.scen .sg{font:800 11px/1 "Nunito Sans",sans-serif;letter-spacing:.25em;text-transform:uppercase;opacity:.85}
.scen .sn{font:900 clamp(20px,5.5vw,28px)/1.1 "Cinzel",Georgia,serif;color:var(--gold);text-shadow:0 2px 0 #4a1a02}
.scen .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.scen .chip{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:rgba(255,246,224,.16);border:1px solid rgba(255,246,224,.4)}
.scen .chip.pv{background:linear-gradient(180deg,#ffe470,var(--gold2));color:#3b1508;border-color:#b5700a}
.tabs{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;padding:8px 0 4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;padding:8px 4px 6px;border-radius:14px 14px 10px 10px;border:1px solid var(--line);border-top:6px solid var(--c);background:var(--card);opacity:.82;box-shadow:0 4px 12px rgba(110,25,0,.15)}
.tab .tn{font-size:13px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .ts{font:900 24px/1 "Cinzel",Georgia,serif}
.tab[aria-selected=true]{opacity:1;transform:translateY(-3px);outline:2px solid var(--c);outline-offset:-1px;box-shadow:0 8px 18px rgba(110,25,0,.25)}
.tab.win{background:linear-gradient(180deg,#ffe470,var(--gold2));color:#3b1508}
.tab:hover:not([aria-selected=true]){opacity:1;background:var(--card)}
.swipe{text-align:center;color:var(--ink);font-size:12px;font-weight:700;margin:8px 0 0;opacity:.85}
.p{border-top:8px solid var(--c);padding:12px 14px;position:relative}
.p.win{outline:3px solid var(--gold2);box-shadow:0 0 0 6px rgba(245,197,24,.25),0 4px 16px rgba(200,120,0,.25)}
.top{display:flex;gap:10px;align-items:center}
.top input{flex:1;min-width:0;font-weight:800;background:transparent;border-color:transparent;font-size:18px}
.top input:hover,.top input:focus{background:var(--btn);border-color:var(--line)}
.score{font:900 46px/1 "Cinzel",Georgia,serif;color:var(--ink)}
.score small{font:600 15px "Nunito Sans",sans-serif;color:var(--mute)}
.prog{height:10px;border-radius:5px;background:#f6e3b0;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .prog{background:#3a1c11}}
:root[data-theme="dark"] .prog{background:#3a1c11}
.prog{border:1px solid var(--line);margin:8px 0 10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);transition:width .25s}
.row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)}
.row span em{font-style:normal;color:var(--mute);font-size:13px;margin-left:6px}
.step{display:flex;align-items:center;gap:8px}
.step b{min-width:2ch;text-align:center;font-size:20px}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tg button{border-radius:999px;font-size:14px}
.tg button[aria-pressed=true]{background:linear-gradient(180deg,#ffe470,var(--gold2));color:#3b1508;border-color:#b5700a}
.foot{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
#rsw{justify-content:center;margin:24px 0 8px}
#rs{background:var(--red);color:#fff6e0;border-color:var(--red);font:900 22px/1 "Cinzel",Georgia,serif;padding:16px 40px;min-height:58px;min-width:min(100%,320px);border-radius:999px;box-shadow:0 6px 18px rgba(120,20,0,.3)}
#rs:hover{background:#c4280f}
.legal{text-align:center;color:var(--mute);font-size:12px;line-height:1.5;margin:18px 0 6px;padding:10px;background:var(--card);border-radius:12px;opacity:.9}
.legal .ver{display:block;margin-top:8px;font-weight:800;letter-spacing:.06em}
.hint{margin:14px 0 0 !important;color:var(--mute);background:var(--card);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
button:disabled{opacity:.45;cursor:default}
.cc{margin-top:14px;padding:14px;border-left:8px solid #2b2b33}
.cc>b{font:700 18px "Cinzel",Georgia,serif}
.pips{display:flex;gap:6px;margin:8px 0 10px}
.pips i{flex:1;height:22px;border-radius:6px;background:linear-gradient(180deg,#7cc6ec,var(--accent));opacity:.45}
.pips i.on{background:#2b2b33;opacity:1}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pips i.on{background:#e8e0d0}}
:root[data-theme="dark"] .pips i.on{background:#e8e0d0}
.vs{display:flex;gap:20px;flex-wrap:wrap;align-items:baseline;font:900 24px/1.2 "Cinzel",Georgia,serif}
.vs small{font:600 14px "Nunito Sans",sans-serif;color:var(--mute)}
.res{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--btn);border-left:6px solid var(--accent)}
.kn{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 0;font-size:14px}
.kn .step b{font-size:17px;min-width:1.5ch}
.kn .sq{width:34px;min-height:34px}

.scr{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;background:linear-gradient(180deg,#9e0306 0%,#c8300f 38%,#ef8a25 70%,#f8d77c 100%);color:#fff6e0;overflow-y:auto;transition:opacity .5s}
.scr[hidden]{display:none}
.scr.out{opacity:0;pointer-events:none}
#splash{cursor:pointer}
#splash{background:#9f0107;justify-content:flex-start;padding-top:calc(14vh + env(safe-area-inset-top,0px));animation:fadein .8s ease-out both}
#splash{--H:100vh;--w:min(100vw,calc(var(--H)*.5629));--h:calc(var(--w)*1.7767)}
@supports (height:100dvh){#splash{--H:100dvh}}
#splash .tap{position:absolute;z-index:2;left:0;right:0;margin:0 auto;width:max-content;max-width:92vw;white-space:nowrap;top:max(calc(10px + env(safe-area-inset-top,0px)),calc((var(--H) - var(--h)*.81)/2 - 27px));font-size:clamp(12px,3.9vw,16px)!important;letter-spacing:.2em!important;padding:15px clamp(18px,6vw,30px)!important;min-height:54px}
.spw{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:var(--w);aspect-ratio:900/1599;pointer-events:none}
.spw img{display:block;width:100%;height:100%}
.spt{position:absolute;left:0;right:0;top:31.5%;display:flex;align-items:center;justify-content:center;gap:calc(var(--w)*.035);font:900 calc(var(--w)*.085)/1 "Nunito Sans",system-ui,sans-serif;letter-spacing:.06em;color:#fff6e0;text-shadow:0 calc(var(--w)*.004) calc(var(--w)*.012) rgba(60,0,0,.6);white-space:nowrap}
.spt::before,.spt::after{content:"";width:calc(var(--w)*.11);height:calc(var(--w)*.011);border-radius:99px;background:#fff6e0;box-shadow:0 calc(var(--w)*.003) calc(var(--w)*.01) rgba(60,0,0,.5)}
#splash .tap{font:800 15px/1.2 "Nunito Sans",sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#3b1508;background:rgba(255,246,224,.85);padding:12px 22px;border-radius:999px;animation:pulse 1.6s ease-in-out infinite}
#splash .tap{box-shadow:0 6px 20px rgba(0,0,0,.4);background:linear-gradient(180deg,#ffe470,#e39a0b);border:2px solid #fff2a0;font-size:16px;padding:16px 30px;min-height:56px;cursor:pointer}
@keyframes fadein{from{opacity:0}}
.scr h2{margin:0;font:900 clamp(30px,8.5vw,52px)/1.1 "Cinzel",Georgia,serif;background:linear-gradient(180deg,#fff2a0,#f5c518 45%,#e39a0b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #4a1a02) drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.box{background:#fff9ec;color:#3b1508;border-radius:20px;padding:22px 20px;width:min(100%,420px);box-shadow:0 14px 40px rgba(80,10,0,.35);display:flex;flex-direction:column;gap:12px}
.box p{margin:0;color:#7a5440;font-size:15px}
.box input{font:800 18px "Nunito Sans",sans-serif;text-align:center;letter-spacing:.12em;text-transform:uppercase;padding:12px;border-radius:12px;border:2px solid #ecd3a0;background:#fdeec4;color:#3b1508}
.box .err{color:#a3120c;font-weight:800;min-height:1.2em}
.big{font:900 18px/1 "Cinzel",Georgia,serif;padding:15px 18px;border-radius:999px;min-height:52px;border:0;color:#fff6e0;background:#a3120c;box-shadow:0 5px 14px rgba(120,20,0,.3)}
.big.gold{background:linear-gradient(180deg,#ffe470,#e39a0b);color:#3b1508}
.big.ghost{background:transparent;color:#1f7fb8;border:2px solid #1f7fb8;box-shadow:none}
.trialbar{display:none;margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px dashed var(--gold2);text-align:center;font-weight:800;color:var(--mute)}
.trialbar.on{display:block}
.trialbar a{color:var(--accent)}
@keyframes pulse{50%{transform:scale(1.06);opacity:.75}}
@keyframes rise{from{transform:translateY(24px) scale(.94);opacity:0}}
@media (prefers-reduced-motion:reduce){#splash,#splash .tap{animation:none}}
#rot{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;background:linear-gradient(180deg,#9e0306,#c8300f 60%,#ef8a25);color:#fff6e0}
#rot svg{width:72px;height:72px;animation:turn 2s ease-in-out infinite}
#rot b{font:900 26px/1.2 "Cinzel",Georgia,serif;color:#f5c518;text-shadow:0 2px 0 #4a1a02}
#rot span{font-size:15px;font-weight:700}
@keyframes turn{0%,20%{transform:rotate(90deg)}60%,100%{transform:rotate(0)}}
@media (orientation:landscape) and (max-height:540px) and (pointer:coarse){#rot{display:flex}body{overflow:hidden}}
.hero div{position:relative}
.hero h1{padding:46px 0 0}
.hbtn{z-index:2;position:absolute;top:12px;width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,246,224,.16);border:1.5px solid rgba(255,246,224,.55);color:#fff6e0}
.hbtn:hover:not(:disabled){background:rgba(255,246,224,.3)}
.hbtn svg{width:22px;height:22px}
.hbtn.l{left:12px}.hbtn.r{right:12px}.hbtn.r2{right:64px}
.hbtn .sun{display:none}
:root[data-theme="dark"] .hbtn .moon{display:none}:root[data-theme="dark"] .hbtn .sun{display:block}
.scr .hbtn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));transform:none}
.modal{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(40,8,0,.55);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal[hidden]{display:none}
.sheet{background:var(--card);color:var(--ink);border-radius:20px;width:min(100%,480px);max-height:100%;overflow-y:auto;padding:18px 16px;box-shadow:0 20px 50px rgba(40,8,0,.5);border-top:6px solid var(--gold2)}
.sheet h2{margin:0 0 12px;text-align:center;font:900 24px/1.2 "Cinzel",Georgia,serif;color:var(--red)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet h2{color:var(--gold)}}
:root[data-theme="dark"] .sheet h2{color:var(--gold)}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.langs button{min-height:48px;font-size:16px}
.langs button[aria-pressed=true],.endb{background:linear-gradient(180deg,#ffe470,var(--gold2));color:#3b1508;border-color:#b5700a}
.vic .sub{text-align:center;color:var(--mute);font-size:14px;margin:-4px 0 12px}
.rank{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--btn);border-left:8px solid var(--c)}
.rank li.first{background:linear-gradient(180deg,#ffe470,var(--gold2));color:#3b1508}
.rank .po{font:900 16px "Cinzel",Georgia,serif;min-width:3ch}
.rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.rank .pt{font:900 24px "Cinzel",Georgia,serif}
.acts{display:flex;flex-direction:column;gap:8px}
.ok{text-align:center;font-size:13px;color:var(--mute);margin:0 0 12px}
.arch{display:flex;flex-direction:column;gap:10px}
.ac{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--btn)}
.ac .dt{font-size:12px;color:var(--mute)}
.ac .sn2{font:700 18px/1.2 "Cinzel",Georgia,serif;margin:2px 0 4px}
.ac .wn{font-weight:800;margin-top:4px}
.chips2{display:flex;flex-wrap:wrap;gap:4px}

let S={n:4,sc:BASE,adj:0,m:{},hold:{road:-1,army:-1,port:-1},p:[0,1,2,3,4,5].map(blank)};
try{const r=JSON.parse(localStorage.getItem(K));if(r&&r.p)S=r}catch(e){}
if(S.sc)S.sc=S.sc.replace("Catán","Catan");S.m=S.m||{};if(S.adj===undefined){S.adj=(S.base!==undefined&&PV[S.sc]!==undefined)?S.base-PV[S.sc]:0;delete S.base}
if(typeof S.msg==="string")S.msg=null;
{const OLD={"Ciudades y Caballeros":()=>{S.cc=1},"La Caravana":()=>{S.m.carav=1},"Los pescadores":()=>{S.m.fish=1},"Catan para 2":()=>{S.m.two=1;S.n=2}};if(OLD[S.sc]){OLD[S.sc]();S.sc=BASE}}
if(PV[S.sc]===undefined)S.sc=BASE;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const MK=["port","wall","spec","carav","jungle","volc","events","castles","magic7","friendly","fish","two","won11","ccmore","ccatk","ccerr","cceasy"];
const chipName=k=>["won11","ccmore","ccatk","ccerr","cceasy"].includes(k)?t("c_"+k):t("v_"+k);
const isSea=()=>GR[S.sc]==="Navegantes";
const seaOn=()=>isSea()||!!S.sea;
function baseFor(){let b=PV[S.sc]||10;
  if(S.sc==="Los Ríos de Catan"&&(S.sea||S.cc))b=12;            // reglas: con Navegantes o C&C, 12 PV
  if(S.sc==="Las Maravillas de Catan"&&S.m.won11)b=11;            // reglas: variante a 11 PV
  if(S.cc&&S.sc===BASE)b=13;                                      // reglas: C&C, 13 PV
  if(S.m.carav&&b<12)b=12;                                        // reglas: La Caravana se juega a 12 PV
  return b}
const target=()=>Math.max(3,baseFor()+(S.adj||0)+(S.m.port?1:0)+(S.m.wall&&!S.cc?1:0)+(S.m.spec&&S.sc!=="Los especialistas"?2:0));
const total=(p,i)=>p.s+2*p.c+p.v+p.e+(S.cc?2*(p.m||0):0)+(S.hold.road===i?2:0)+(S.hold.army===i?2:0)+(S.m.port&&S.hold.port===i?2:0);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
$("n").innerHTML=[2,3,4,5,6].map(k=>`<option value="${k}">${k}</option>`).join("");
function buildList(){$("scl").innerHTML=G.map(g=>`<div class="gt" role="presentation">${esc(grName(g[0]))}</div>`+g[1].map(x=>`<button class="op" role="option" data-v="${esc(x[0])}"><span>${esc(scName(x[0]))}</span><span>${x[1]} ${t("pv")}</span></button>`).join("")).join("")}
const openDD=o=>{$("scl").hidden=!o;$("sc").setAttribute("aria-expanded",o)};
$("sc").onclick=()=>openDD($("scl").hidden);
$("scl").onclick=e=>{const b=e.target.closest(".op");if(!b)return;S.sc=b.dataset.v;S.adj=0;if(S.sc!=="Las Maravillas de Catan")S.m.won11=0;if(isSea())S.sea=0;openDD(false);$("sc").focus();draw()};
document.addEventListener("click",e=>{if(!e.target.closest(".dd"))openDD(false)});
const stepper=(i,k,label,note)=>`<div class="row"><span>${label}<em>${note}</em></span><div class="step"><button class="sq" data-i="${i}" data-k="${k}" data-d="-1" aria-label="${esc(t("rem",{l:label}))}">−</button><b>${S.p[i][k]||0}</b><button class="sq" data-i="${i}" data-k="${k}" data-d="1" aria-label="${esc(t("add",{l:label}))}">+</button></div></div>`;
function leader(){const tg=target();let best=-1,bi=-1;S.p.slice(0,S.n).forEach((p,i)=>{const v=total(p,i);if(v>=tg&&v>best){best=v;bi=i}});return[bi,best]}
function draw(){
  if(S.sc!==BASE){S.m.carav=0;S.m.fish=0}if(S.cc)S.m.wall=0;if(S.sc==="Los especialistas")S.m.spec=0;
  {const no2=S.sc===BASE&&!S.m.two;const o2=$("n").querySelector('option[value="2"]');o2.disabled=no2;if(no2&&S.n<3)S.n=3}
  const pv=t("pv");
  $("n").value=S.n;$("sc").innerHTML=`<span>${esc(scName(S.sc))}</span><span>▾</span>`;document.querySelectorAll(".op").forEach(o=>o.setAttribute("aria-selected",o.dataset.v===S.sc));$("tv").textContent=target();
  $("m_cc").checked=!!S.cc;$("m_sea").checked=!!S.sea;$("l_sea").hidden=isSea();$("l_wall").hidden=!!S.cc;$("l_spec").hidden=S.sc==="Los especialistas";$("l_carav").hidden=S.sc!==BASE;$("l_fish").hidden=S.sc!==BASE;
  document.querySelectorAll("[data-m]").forEach(c=>c.checked=!!S.m[c.dataset.m]);
  $("g_wonders").hidden=S.sc!=="Las Maravillas de Catan";$("g_ccv").hidden=!S.cc;
  const act=(S.cc?1:0)+(S.sea?1:0)+MK.filter(k=>S.m[k]&&!(k.startsWith("cc")&&!S.cc)).length;
  $("mcnt").textContent=act?t("active",{n:act}):"";
  const w=[];
  if(S.cc&&seaOn())w.push(t("wSea"));
  if(S.sc==="Los Ríos de Catan"&&(S.sea||S.cc))w.push(t("wRiv",{x:t(S.sea&&S.cc?"wRivBoth":S.sea?"wRivSea":"wRivCc")}));
  if(S.m.fish)w.push(t("wFish"));
  if(S.m.two&&S.n!==2)w.push(t("wTwo"));
  $("mwarn").innerHTML=w.map(x=>"• "+esc(x)).join("<br>");
  const tg=target(),[bi,best]=leader(),ps=S.p.slice(0,S.n);
  $("ban").innerHTML=bi>=0?`<div class="banner" role="status">${esc(t("banner",{name:ps[bi].name,pv:best}))}<button type="button" id="banEnd">${esc(t("endGame"))}</button></div>`:"";
  if(bi>=0)$("banEnd").onclick=endGame;
  const chips=[`<span class="chip pv">${esc(t("goal",{t:tg}))}</span>`,`<span class="chip">${esc(t("nPl",{n:S.n}))}</span>`];
  if(S.cc)chips.push(`<span class="chip">+ ${esc(t("x_cc"))}</span>`);
  if(S.sea)chips.push(`<span class="chip">+ ${esc(t("x_sea"))}</span>`);
  MK.forEach(k=>{if(S.m[k]&&!(k.startsWith("cc")&&!S.cc))chips.push(`<span class="chip">+ ${esc(chipName(k))}</span>`)});
  $("scen").innerHTML=`<span class="sg">${esc(grName(GR[S.sc]))}</span><span class="sn">${esc(scName(S.sc))}</span><span class="chips">${chips.join("")}</span>`;
  S.tab=Math.min(Math.max(0,S.tab||0),S.n-1);
  const tabs=$("tabs");tabs.style.setProperty("--n",S.n);
  tabs.innerHTML=ps.map((p,i)=>`<button class="tab${bi===i?" win":""}" role="tab" id="tab${i}" aria-controls="g" aria-selected="${i===S.tab}" tabindex="${i===S.tab?0:-1}" data-t="${i}" style="--c:${COL[i]}"><span class="tn">${esc(p.name)}</span><span class="ts">${total(p,i)}</span></button>`).join("");
  $("g").setAttribute("role","tabpanel");$("g").setAttribute("aria-labelledby","tab"+S.tab);
  $("g").innerHTML=ps.map((p,i)=>{if(i!==S.tab)return "";const v=total(p,i);
    const tgb=(k,l)=>`<button data-h="${k}" data-i="${i}" aria-pressed="${S.hold[k]===i}">${esc(l)} (2)</button>`;
    return `<article class="p${bi===i?" win":""}" style="--c:${COL[i]}">
    <div class="top"><input type="text" value="${esc(p.name)}" data-name="${i}" aria-label="${esc(t("nameAria",{i:i+1}))}"><div class="score">${v}<small> / ${tg}</small></div></div>
    <div class="prog"><i style="width:${Math.min(100,v/tg*100)}%"></i></div>
    ${stepper(i,"s",t("settlements"),"1 "+pv)}${stepper(i,"c",t("cities"),"2 "+pv)}${stepper(i,"v",t("vpCards"),"1 "+pv)}${stepper(i,"e",t("extras"),t("each"))}${S.cc?ccRows(i):""}
    <div class="tg">${tgb("road",t("road"))}${tgb("army",t("army"))}${S.m.port?tgb("port",t("v_port")):""}</div></article>`}).join("");
  drawCC();save();
}
const BAR=7;
const gv=(p,k)=>p[k]||0;
const ccRows=i=>{const p=S.p[i];const bt=(k,d,l,x)=>`<button class="sq" data-i="${i}" data-k="${k}" data-d="${d}" aria-label="${esc(l)}">${x}</button>`;
  const kr=(L2,n)=>`<div class="kn"><span>${n}</span><span class="step">${bt("k"+L2,-1,t("kRem",{l:n}),"−")}<b>${gv(p,"k"+L2)}</b>${bt("k"+L2,1,t("kAdd",{l:n}),"+")}</span><span class="step">${t("act")} ${bt("a"+L2,-1,t("kOff",{l:n}),"−")}<b>${gv(p,"a"+L2)}</b>${bt("a"+L2,1,t("kOn",{l:n}),"+")}</span></div>`;
  return stepper(i,"m",t("metro"),t("metroNote"))+stepper(i,"w",t("walls"),t("hand",{n:7+2*gv(p,"w")}))+`<div class="row"><span>${t("knights")}<em>${t("knightsNote")}</em></span></div>`+kr(1,t("basic"))+kr(2,t("strong"))+kr(3,t("mighty"))};
function force(){let b=0,d=0;S.p.slice(0,S.n).forEach(p=>{b+=p.c;d+=gv(p,"a1")+2*gv(p,"a2")+3*gv(p,"a3")});return[b,d]}
function msgText(m){if(!m)return "";if(m.k==="arrive")return t("arrive");if(m.k==="def")return t("defWin",m);
  return t("barWin",{b:m.b,d:m.d,list:m.out.map(([n,l])=>t(l?"loses":"noCity",{name:n})).join("; ")})}
function resolve(){const ps=S.p.slice(0,S.n),[b,d]=force();
  if(d>=b)S.msg={k:"def",d,b};
  else{const f=ps.map(p=>gv(p,"a1")+2*gv(p,"a2")+3*gv(p,"a3"));const mn=Math.min(...f);const out=[];
    ps.forEach((p,i)=>{if(f[i]!==mn)return;if(p.c-gv(p,"m")>0){p.c--;p.s++;p.w=Math.min(gv(p,"w"),p.c);out.push([p.name,1])}else out.push([p.name,0])});
    S.msg={k:"bar",b,d,out}}
  ps.forEach(p=>{p.a1=p.a2=p.a3=0});S.bar=0;draw()}
function drawCC(){const el=$("cc");if(!S.cc){el.innerHTML="";return}
  const [b,d]=force(),r=S.bar||0;
  el.innerHTML=`<section class="cc"><b>${esc(t("barb",{r,m:BAR}))}</b><div class="pips" role="img" aria-label="${esc(t("barb",{r,m:BAR}))}">${Array.from({length:BAR},(_,k)=>`<i class="${k<r?"on":""}"></i>`).join("")}</div><div class="vs"><span>${esc(t("barbS"))} ${b}<small> ${esc(t("barbCities"))}</small></span><span>${esc(t("defense"))} ${d}<small> ${esc(t("swords"))}</small></span></div><div class="foot"><button data-a="bp">${esc(t("adv"))}</button><button data-a="bm">${esc(t("back"))}</button><button data-a="br" ${r<BAR?"disabled":""}>${esc(t("resolve"))}</button></div>${S.msg?`<div class="res" role="status">${esc(msgText(S.msg))}</div>`:""}</section>`;
  el.onclick=e=>{const a=e.target.closest("button");if(!a)return;const k=a.dataset.a;
    if(k==="bp"){S.bar=Math.min(BAR,(S.bar||0)+1);S.msg=S.bar>=BAR?{k:"arrive"}:null}
    else if(k==="bm"){S.bar=Math.max(0,(S.bar||0)-1);S.msg=null}
    else if(k==="br")return resolve();
    draw()}}
$("m_cc").onchange=e=>{S.cc=e.target.checked?1:0;draw()};
$("n").onchange=e=>{S.n=+e.target.value;draw()};
$("tm").onclick=()=>{if(target()>3)S.adj=(S.adj||0)-1;draw()};
$("tp").onclick=()=>{S.adj=(S.adj||0)+1;draw()};
$("m_sea").onchange=e=>{S.sea=e.target.checked?1:0;draw()};
document.querySelectorAll("[data-m]").forEach(c=>c.onchange=()=>{const k=c.dataset.m;S.m[k]=c.checked?1:0;if(k==="port"&&!S.m.port)S.hold.port=-1;if(k==="two"&&c.checked)S.n=2;draw()});
$("g").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.k){const p=S.p[+b.dataset.i],k=b.dataset.k;p[k]=Math.max(0,(p[k]||0)+ +b.dataset.d);for(const L2 of[1,2,3])p["a"+L2]=Math.min(p["a"+L2]||0,p["k"+L2]||0);if(S.cc){p.m=Math.min(p.m||0,p.c);p.w=Math.min(p.w||0,p.c)}}
  else if(b.dataset.h){const i=+b.dataset.i,h=b.dataset.h;S.hold[h]=S.hold[h]===i?-1:i}
  draw()});
$("g").addEventListener("input",e=>{if(e.target.dataset.name!==undefined){const i=+e.target.dataset.name;S.p[i].name=e.target.value;const x=document.querySelector(`#tab${i} .tn`);if(x)x.textContent=e.target.value;save()}});
const goTab=(i,focus)=>{S.tab=(i+S.n)%S.n;draw();if(focus)$("tab"+S.tab).focus()};
$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)goTab(+b.dataset.t)});
$("tabs").addEventListener("keydown",e=>{const k={ArrowRight:1,ArrowLeft:-1}[e.key];if(k){e.preventDefault();goTab(S.tab+k,true)}else if(e.key==="Home"){e.preventDefault();goTab(0,true)}else if(e.key==="End"){e.preventDefault();goTab(S.n-1,true)}});
let sx=null,sy=0;
$("g").addEventListener("touchstart",e=>{if(e.target.closest("input"))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("g").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)goTab(S.tab+(dx<0?1:-1))},{passive:true});

function resetScores(){S.p.forEach((p,i)=>{const nm=p.name;S.p[i]=blank(i);S.p[i].name=nm});S.hold={road:-1,army:-1,port:-1};S.bar=0;S.msg=null;S.gid=0;S.tab=0}
function freshGame(){S.p=[0,1,2,3,4,5].map(blank);S.hold={road:-1,army:-1,port:-1};S.bar=0;S.msg=null;S.gid=0;S.sc=BASE;S.n=3;S.adj=0;S.cc=0;S.sea=0;S.m={};S.tab=0;$("mods").open=false;draw();scrollTo({top:0,behavior:"smooth"})}
function rematch(){if(!newTrialGame())return;resetScores();closeModal();draw();scrollTo({top:0,behavior:"smooth"})}

  armed=0;$("rs").textContent=t("newGame");if(!newTrialGame())return;freshGame()};
const hist=()=>{try{const h=JSON.parse(localStorage.getItem(HK));return Array.isArray(h)?h:[]}catch(e){return[]}};
const setHist=h=>{try{localStorage.setItem(HK,JSON.stringify(h))}catch(e){}};
const dispName=p=>LANGS.some(l=>COLN[l][p.col]===p.name)?COLN[L][p.col]:p.name;
function ranked(ps){return ps.slice().sort((a,b)=>b.tot-a.tot).map(p=>({...p,name:dispName(p),pos:1+ps.filter(q=>q.tot>p.tot).length}))}
function endGame(){
  const ps=S.p.slice(0,S.n).map((p,i)=>({name:p.name||colName(i),col:i,tot:total(p,i),s:p.s,c:p.c,v:p.v,e:p.e,m:S.cc?gv(p,"m"):0,road:S.hold.road===i?1:0,army:S.hold.army===i?1:0,port:S.m.port&&S.hold.port===i?1:0}));
  const rec={id:S.gid||Date.now(),d:Date.now(),sc:S.sc,cc:S.cc?1:0,sea:S.sea?1:0,m:{...S.m},tgt:target(),n:S.n,ps};
  S.gid=rec.id;setHist([rec,...hist().filter(r=>r.id!==rec.id)].slice(0,200));save();showVictory(rec)}
$("eg").onclick=endGame;

/* ===== Ventanas ===== */
function openModal(html){$("sheet").innerHTML=html;$("modal").hidden=false;const f=$("sheet").querySelector("button");if(f)f.focus()}
function closeModal(){$("modal").hidden=true;$("sheet").innerHTML="";stopConfetti()}
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("modal").hidden)closeModal();else if(!$("scl").hidden){openDD(false);$("sc").focus()}});
function recChips(r){const c=[t("goal",{t:r.tgt}),t("nPl",{n:r.n})];if(r.cc)c.push(t("x_cc"));if(r.sea)c.push(t("x_sea"));MK.forEach(k=>{if(r.m&&r.m[k]&&!(k.startsWith("cc")&&!r.cc))c.push(chipName(k))});return c}
function rankList(r){return `<ol class="rank">${ranked(r.ps).map(p=>`<li class="${p.pos===1?"first":""}" style="--c:${COL[p.col]}"><span class="po">${ord(p.pos)}</span><span class="nm">${esc(p.name)}</span><span class="pt">${p.tot}</span></li>`).join("")}</ol>`}
function showVictory(r){const R=ranked(r.ps),top=R[0].tot,first=R.filter(p=>p.pos===1);
  const title=first.length>1?t("tie",{n:top}):t("wins",{name:first[0].name});
  openModal(`<div class="vic"><h2>🏆 ${esc(title)}</h2><p class="sub">${esc(scName(r.sc))} · ${esc(t("goal",{t:r.tgt}))}${top<r.tgt?" · "+esc(t("noGoal")):""}</p>${rankList(r)}<p class="ok">✓ ${esc(t("saved"))}</p>
  <div class="acts"><button class="big gold" id="vRe">${esc(t("rematch"))}</button><button class="big" id="vNew">${esc(t("newGame"))}</button><button class="big ghost" id="vBack">${esc(t("backGame"))}</button></div></div>`);
  $("vRe").onclick=rematch;$("vNew").onclick=()=>{if(!newTrialGame())return;closeModal();freshGame()};$("vBack").onclick=closeModal;
  if(top>=r.tgt)confetti()}
function detail(p,r){const pv=t("pv"),x=[`${t("settlements")} ${p.s}`,`${t("cities")} ${p.c}`,`${t("vpCards")} ${p.v}`,`${t("extras")} ${p.e}`];
  if(r.cc)x.push(`${t("metro")} ${p.m}`);if(p.road)x.push(`${t("road")} (2)`);if(p.army)x.push(`${t("army")} (2)`);if(p.port)x.push(`${t("v_port")} (2)`);
  return `<div class="dp" style="--c:${COL[p.col]}"><b><span>${ord(p.pos)} ${esc(p.name)}</span><span>${p.tot} ${pv}</span></b><small>${esc(x.join(" · "))}</small></div>`}
function showArchive(){const H=hist();
  const fmt=d=>{try{return new Date(d).toLocaleString(L,{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return new Date(d).toLocaleString()}};
  const cards=H.map(r=>{const R=ranked(r.ps),first=R.filter(p=>p.pos===1);
    const win=first.length>1?t("tie",{n:R[0].tot}):`🏆 ${first[0].name} · ${R[0].tot} ${t("pv")}`;
    return `<article class="ac" data-id="${r.id}"><div class="dt">${esc(fmt(r.d))}</div><div class="sn2">${esc(scName(r.sc))}</div><div class="chips2">${recChips(r).map(c=>`<span>${esc(c)}</span>`).join("")}</div><div class="wn">${esc(win)}</div>
    <div class="det" hidden>${R.map(p=>detail(p,r)).join("")}</div>
    <div class="row2"><button type="button" data-x="tog" aria-expanded="false">${esc(t("view"))}</button><button type="button" data-x="del">${esc(t("del"))}</button></div></article>`}).join("");
  openModal(`<h2>${esc(t("archive"))}</h2>${H.length?`<div class="arch">${cards}</div>`:`<p class="ok" style="font-size:15px">${esc(t("archEmpty"))}</p>`}
  <div class="acts" style="margin-top:14px">${H.length?`<button class="big ghost" id="aClr">${esc(t("clearAll"))}</button>`:""}<button class="big" id="aClose">${esc(t("close"))}</button></div>`);
  $("aClose").onclick=closeModal;
  if($("aClr")){let arm=0;$("aClr").onclick=e=>{if(!arm){arm=1;e.target.textContent=t("delSure");setTimeout(()=>{arm=0;if($("aClr"))$("aClr").textContent=t("clearAll")},3000);return}setHist([]);showArchive()}}
  $("sheet").querySelectorAll(".ac").forEach(a=>{let arm=0;a.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.x==="tog"){const d=a.querySelector(".det");d.hidden=!d.hidden;b.textContent=t(d.hidden?"view":"hide");b.setAttribute("aria-expanded",!d.hidden)}
    else if(b.dataset.x==="del"){if(!arm){arm=1;b.textContent=t("delSure");setTimeout(()=>{arm=0;b.textContent=t("del")},3000);return}
      const id=+a.dataset.id;setHist(hist().filter(r=>r.id!==id));if(S.gid===id){S.gid=0;save()}showArchive()}}})}
$("archBtn").onclick=showArchive;
function setTheme(m){document.documentElement.setAttribute("data-theme",m);try{localStorage.setItem("catan-tema",m)}catch(e){}const mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.content=m==="dark"?"#5e0204":"#9e0306";$("themeBtn").setAttribute("aria-pressed",m==="dark")}
$("themeBtn").onclick=()=>setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
$("themeBtn").setAttribute("aria-pressed",document.documentElement.getAttribute("data-theme")==="dark");
function showLang(){openModal(`<h2>${esc(t("lang"))}</h2><div class="langs">${LANGS.map(k=>`<button type="button" data-l="${k}" aria-pressed="${k===L}" lang="${k}">${LN[k]}</button>`).join("")}</div><div class="acts" style="margin-top:14px"><button class="big ghost" id="lClose">${esc(t("close"))}</button></div>`);
  $("sheet").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{setLang(b.dataset.l);closeModal()});$("lClose").onclick=closeModal}
document.querySelectorAll(".lg").forEach(b=>b.onclick=showLang);

/* Confeti */
let cfRun=0;
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=$("cf"),x=c.getContext("2d");c.hidden=false;c.width=innerWidth;c.height=innerHeight;
  const cols=["#f5c518","#e39a0b","#d1382c","#2a6fc9","#3f9b52","#fff6e0"],P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:4+Math.random()*4,c:cols[Math.random()*cols.length|0]}));
  const id=++cfRun,t0=performance.now();
  (function f(n){if(id!==cfRun)return;x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(n-t0<3500)requestAnimationFrame(f);else stopConfetti()})(t0)}
function stopConfetti(){cfRun++;const c=$("cf");c.hidden=true}

/* ===== Aplicar idioma ===== */
function applyLang(){document.documentElement.lang=L;document.title=t("title");$("ver").textContent=`${t("title")} · v${VERSION}`;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll("[data-ih]").forEach(e=>e.innerHTML=t(e.dataset.ih));
  document.querySelectorAll("[data-ia]").forEach(e=>e.setAttribute("aria-label",t(e.dataset.ia)));
  document.querySelectorAll("[data-ip]").forEach(e=>e.setAttribute("placeholder",t(e.dataset.ip)));
  document.querySelectorAll(".p1").forEach(e=>e.textContent="+1 "+t("pv"));document.querySelectorAll(".p2").forEach(e=>e.textContent="+2 "+t("pv"));
  buildList();if(!$("lic").hidden)renderLic();trialUI()}
function setLang(k){if(!LANGS.includes(k))return;
  S.p.forEach((p,i)=>{if(LANGS.some(l=>COLN[l][i]===p.name))p.name=COLN[k][i]});
  L=k;try{localStorage.setItem(LGK,k)}catch(e){}applyLang();draw()}
/* Nombres por defecto: si están en otro idioma, se pasan al actual */
S.p.forEach((p,i)=>{if(LANGS.some(l=>COLN[l][i]===p.name))p.name=COLN[L][i]});

/* ===== Licencia y entrada ===== */
const LICENSE_KEY="CATAN-PENTECH-2026";        // ← cambia aquí la clave
const BUY_URL="https://buymeacoffee.com/pentech"; // ← pon aquí el enlace de compra
const TRIAL_MAX=3;
const LK="catan-licencia-v1",TK="catan-prueba-v1";
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const norm=v=>String(v||"").trim().toUpperCase().replace(/\s+/g,"");
const licensed=()=>ls.get(LK)===norm(LICENSE_KEY);
const used=()=>+(ls.get(TK)||0);
let trial=false;
function trialUI(){const b=$("trialbar");if(!trial){b.className="trialbar";return}
  b.className="trialbar on";b.textContent=t("trial",{u:used(),m:TRIAL_MAX,l:TRIAL_MAX-used()})}
function newTrialGame(){if(!trial)return true;
  if(used()>=TRIAL_MAX){showLic(true);return false}
  ls.set(TK,used()+1);trialUI();return true}
let licEnded=false;
function renderLic(){const left=TRIAL_MAX-used();
  $("licMsg").textContent=t(licEnded?"licEnded":"licMsg");$("licTry").hidden=left<=0;
  $("licLeft").textContent=left>0?t("licLeft",{n:left,m:TRIAL_MAX}):"";if($("licErr").textContent)$("licErr").textContent=t("licErr")}
function showLic(ended){licEnded=!!ended;closeModal();$("licErr").textContent="";renderLic();$("lic").hidden=false;$("lic").classList.remove("out")}
function enterApp(){$("lic").classList.add("out");setTimeout(()=>{$("lic").hidden=true},500);trialUI()}
$("licGo").onclick=()=>{if(norm($("licKey").value)===norm(LICENSE_KEY)){ls.set(LK,norm(LICENSE_KEY));trial=false;enterApp()}else{$("licErr").textContent=t("licErr")}};
$("licKey").onkeydown=e=>{if(e.key==="Enter")$("licGo").click()};
$("licBuy").onclick=()=>window.open(BUY_URL,"_blank","noopener");
$("licTry").onclick=()=>{trial=true;
  if(ls.get(TK+"-activa")!=="1"||used()===0){if(used()>=TRIAL_MAX)return showLic(true);ls.set(TK,used()+1);ls.set(TK+"-activa","1")}
  enterApp()};
/* Melodía original: tema de aventura con laúd y bordón */
let actx;
function melody(){try{try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}actx=actx||new (window.AudioContext||window.webkitAudioContext)();const c=actx;if(c.state==="suspended")c.resume();
  const t0=c.currentTime+.05,master=c.createGain();master.gain.value=.22;master.connect(c.destination);
  const f=n=>440*Math.pow(2,(n-69)/12);
  const pluck=(n,t,d,v=1)=>{const o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
    o.type="triangle";o2.type="sawtooth";o.frequency.value=f(n);o2.frequency.value=f(n)*1.003;lp.type="lowpass";lp.frequency.setValueAtTime(3200,t);lp.frequency.exponentialRampToValueAtTime(700,t+d);
    const g2=c.createGain();g2.gain.value=.25;o2.connect(g2);g2.connect(lp);o.connect(lp);lp.connect(g);g.connect(master);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.55*v,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05)};
  const drone=(n,t,d)=>{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f(n);o.connect(g);g.connect(master);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.6);g.gain.setValueAtTime(.18,t+d-1);g.gain.linearRampToValueAtTime(0,t+d);o.start(t);o.stop(t+d+.1)};
  const b=.27; // duración de corchea
  const mel=[[62,1],[69,1],[67,.5],[66,.5],[67,1],[69,2],[74,1],[72,.5],[71,.5],[69,1],[67,1],[69,3],
             [62,1],[69,1],[67,.5],[69,.5],[71,1],[72,2],[71,1],[69,.5],[67,.5],[66,1],[64,1],[62,4]];
  let t=t0;mel.forEach(([n,d])=>{pluck(n,t,Math.max(.35,d*b*2.2));if(d>=2)pluck(n-12,t,d*b*2,.5);t+=d*b*2});
  drone(50,t0,t-t0+.8);drone(57,t0,t-t0+.8);
  [[50,0],[48,6],[50,12],[55,18],[50,24]].forEach(([n,beat])=>pluck(n,t0+beat*b*2,1.2,.6));
}catch(e){}}
function start(){const sp=$("splash");if(sp.classList.contains("out"))return;melody();sp.classList.add("out");setTimeout(()=>{sp.hidden=true},500);
  if(licensed()){trial=false;trialUI()}else showLic(used()>=TRIAL_MAX)}
$("splash").onclick=start;$("splash").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();start()}};

applyLang();draw();
try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock("portrait").catch(()=>{})}catch(e){}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
